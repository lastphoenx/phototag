[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phototag"
version = "0.7.11"
description = "Local photo and video tagging with a vision LLM and SQLite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pillow>=10.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
admin = ["flask>=3.0", "gunicorn>=22.0"]
faceblur = ["opencv-python-headless>=4.9", "numpy>=1.26"]
faceblur-mp = ["mediapipe>=0.10"]

[project.scripts]
phototag = "phototag.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["phototag*"]

[tool.setuptools.package-data]
phototag = ["categories.example.txt", "static/admin/*", "templates/admin/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
