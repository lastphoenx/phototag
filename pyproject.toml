[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phototag"
version = "0.3.6"
description = "Local photo and video tagging with a vision LLM and SQLite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pillow>=10.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
phototag = "phototag.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["phototag*"]

[tool.setuptools.package-data]
phototag = ["categories.example.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
