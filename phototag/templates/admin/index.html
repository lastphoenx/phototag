<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>phototag Review</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <header class="bar">
    <h1>phototag Review</h1>
    <div class="bar-actions">
      <label class="chk"><input type="checkbox" id="pushAfter" checked> Nach Freigabe push-nc</label>
      <button type="button" id="reloadBtn">Aktualisieren</button>
      <form method="post" action="/logout" style="display:inline"><button type="submit">Abmelden</button></form>
    </div>
  </header>

  <p id="statusLine" class="status"></p>

  <div class="browse-bar">
    <label>Ansicht
      <select id="viewMode">
        <option value="browse" selected>Ordner durchsuchen (Mount)</option>
        <option value="review">Review-Queue (gesamt)</option>
      </select>
    </label>
    <label id="filterWrap" class="hidden">Filter
      <select id="browseFilter">
        <option value="all">Alle</option>
        <option value="review">In Review</option>
        <option value="tagged">Mit Tags</option>
        <option value="untagged">Ohne Tags</option>
      </select>
    </label>
    <div id="folderNav" class="folder-nav hidden">
      <nav id="breadcrumb" class="breadcrumb"></nav>
    </div>
  </div>
  <div id="subfolders" class="subfolders hidden"></div>

  <main id="queue" class="queue"></main>

  <script src="/static/admin.js"></script>
</body>
</html>
