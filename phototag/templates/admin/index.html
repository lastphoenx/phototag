<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>phototag Review</title>
  <link rel="stylesheet" href="/static/admin.css?v={{ app_version }}">
</head>
<body data-telegram-enabled="{{ '1' if telegram_enabled else '0' }}" data-faceblur-enabled="{{ '1' if faceblur_enabled else '0' }}" data-faceblur-region="{{ faceblur_region }}" data-faceblur-strength="{{ faceblur_strength }}" data-faceblur-mode="{{ faceblur_mode }}">
  <header class="bar">
    <h1>phototag Review</h1>
    <div class="bar-actions">
      <label class="chk"><input type="checkbox" id="pushAfter" checked> Nach Freigabe push-nc</label>
      <button type="button" id="reloadBtn">Aktualisieren</button>
      <form method="post" action="/logout" style="display:inline"><button type="submit">Abmelden</button></form>
    </div>
  </header>

  <p id="statusLine" class="status"></p>

  <div class="browse-bar">
    <label>Ansicht
      <select id="viewMode">
        <option value="browse" selected>Ordner durchsuchen (Mount)</option>
        <option value="search">Stichworte &amp; Tags (DB)</option>
        <option value="review">Review-Queue (gesamt)</option>
      </select>
    </label>
    <div id="searchBar" class="search-bar hidden">
      <label>Stichworte
        <input type="search" id="searchQuery" autocomplete="off" placeholder="Caption, Pfad, Ordner, Tags …">
      </label>
      <label>Tag(s)
        <input type="text" id="searchTags" list="tagCatalog" autocomplete="off" placeholder="exakt, kommagetrennt">
      </label>
      <label class="chk"><input type="checkbox" id="searchAny"> OR (ein Begriff reicht)</label>
      <label class="chk"><input type="checkbox" id="searchFuzzy"> Fuzzy</label>
      <button type="button" id="searchBtn" class="primary">Suchen</button>
    </div>
    <label id="filterWrap" class="hidden">Filter
      <select id="browseFilter">
        <option value="all">Alle</option>
        <option value="review">In Review</option>
        <option value="tagged">Mit Tags</option>
        <option value="untagged">Ohne Tags</option>
        <option value="blurred">Blur-Kopien (prüfen)</option>
      </select>
    </label>
    <label id="retagWrap" class="chk hidden"><input type="checkbox" id="tagRetag"> Neu taggen (retag)</label>
    <label id="browseRecursiveWrap" class="chk hidden"><input type="checkbox" id="browseRecursive"> In Unterordnern</label>
    <div id="folderNav" class="folder-nav hidden">
      <nav id="breadcrumb" class="breadcrumb"></nav>
      <button type="button" id="tagFolderBtn" class="primary">Ordner KI-taggen</button>
      <label class="chk"><input type="checkbox" id="tagRecursive" checked> Unterordner</label>
    </div>
  </div>
    <div id="subfolders" class="subfolders hidden"></div>
  <div id="blurSettingsBar" class="blur-settings hidden" aria-label="Face-Blur Einstellungen"></div>

  <nav id="browsePager" class="browse-pager hidden" aria-label="Seiten"></nav>

  <div id="jobPanel" class="job-panel hidden"></div>

  <main id="queue" class="queue"></main>

  <script src="/static/admin.js?v={{ app_version }}"></script>
</body>
</html>
